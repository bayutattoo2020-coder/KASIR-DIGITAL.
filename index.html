<style>
:root{--blue:#2457d6;--blue2:#1946b5;--orange:#f47721;--yellow:#f7c948;--bg:#f4f7fc;--ink:#18243a;--muted:#6b7890;--line:#e4eaf3;--white:#fff;--red:#c93636;--green:#168451;--shadow:0 8px 28px #19345d0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:11px;padding:10px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer}button:hover{filter:brightness(.97)}button:disabled{opacity:.45;cursor:not-allowed}.btn-orange{background:var(--orange)}.btn-yellow{background:var(--yellow);color:#594000}.btn-light{background:#eaf0ff;color:var(--blue)}.btn-danger{background:#ffebeb;color:#b42323}.btn-outline{background:#fff;color:#42516a;border:1px solid var(--line)}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d6deea;border-radius:10px;background:white;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2457d61a}label{display:block;font-weight:650;font-size:12px;color:#4c5a70;margin:10px 0 5px}.muted{color:var(--muted)}.tiny{font-size:11px}.hidden{display:none!important}.row{display:flex;gap:9px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.grow{flex:1;min-width:0}
#login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#1946b5,#326be7 65%,#f47721)}.loginbox{width:min(420px,100%);background:#fff;border-radius:23px;padding:25px;box-shadow:0 25px 70px #102b6140}.logoMark{width:48px;height:48px;border-radius:15px;background:var(--blue);color:white;display:grid;place-items:center;font-size:25px;font-weight:900}.loginbox h1{font-size:22px;margin:0}.loginbox .sub{color:var(--muted);font-size:12px;margin:2px 0 20px}.rolebuttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:15px}.hint{background:#fff7e7;color:#80520b;padding:10px;border-radius:10px;font-size:12px;margin-top:14px}
header{height:62px;background:var(--blue);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(15px,calc((100vw - 1380px)/2));position:sticky;top:0;z-index:5;box-shadow:0 3px 15px #173d9c30}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.3px}.brandIcon{width:34px;height:34px;border-radius:10px;background:#ffffff24;display:grid;place-items:center;font-size:20px}.headerRight{display:flex;align-items:center;gap:8px}.headerRight button{background:#ffffff20;padding:8px 11px}.shell{max-width:1380px;margin:auto;display:flex;min-height:calc(100dvh - 62px)}aside{width:225px;flex:none;padding:18px 12px}.nav{position:sticky;top:78px;display:grid;gap:4px}.nav button{background:transparent;color:#526078;text-align:left;display:flex;gap:12px;align-items:center;padding:11px 12px}.nav button.active{background:#e6edff;color:var(--blue)}.nav .ico{width:22px;text-align:center;font-size:17px}main{flex:1;min-width:0;padding:23px 22px 90px}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.pagehead h2{margin:0;font-size:22px}.pagehead p{margin:3px 0 0;color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;gap:10px}.stat .value{font-size:22px;font-weight:850;margin-top:5px;overflow-wrap:anywhere}.statIcon{width:38px;height:38px;border-radius:12px;background:#eaf0ff;display:grid;place-items:center;font-size:19px}.section{margin-top:17px}.section h3,.card h3{font-size:15px;margin:0 0 11px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{min-height:74px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px}.quick b{font-size:19px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:290px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}table{border-collapse:collapse;width:100%;min-width:580px}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}th{background:#f8faff;color:#627089;font-size:11px}tr:last-child td{border-bottom:0}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{font-size:11px;padding:7px 9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.empty{padding:26px;text-align:center;color:var(--muted)}.notice{padding:11px 13px;border-radius:11px;background:#fff7e5;color:#80520b;font-size:12px;margin-bottom:12px}.pill{display:inline-block;padding:3px 8px;border-radius:30px;background:#eaf0ff;color:var(--blue);font-size:10px;font-weight:750}.productgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.product{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.product img{width:100%;height:105px;object-fit:cover;background:#edf2fa}.productbody{padding:9px}.product h4{font-size:13px;margin:0 0 4px}.price{color:var(--blue);font-weight:850}.product button{width:100%;margin-top:8px;padding:8px}.modal{position:fixed;inset:0;background:#101c32a6;z-index:20;display:grid;place-items:center;padding:14px}.modalbox{width:min(570px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:17px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.modalhead h3{margin:0}.bottomnav{display:none}.toast{position:fixed;z-index:40;bottom:20px;left:50%;transform:translateX(-50%);background:#17243b;color:white;padding:10px 15px;border-radius:12px;box-shadow:0 6px 25px #0003;font-size:12px;max-width:90vw}.balance{background:#172e68;color:white;border-radius:15px;padding:18px}.balance .amount{font-size:29px;font-weight:850}.profile{width:65px;height:65px;object-fit:cover;border-radius:15px;background:#eaf0ff}.receipt{font:12px/1.35 monospace;width:54mm;max-width:100%;margin:auto;color:#111}.receipt h3{text-align:center;margin:4px}.receipt .center{text-align:center}.receipt .line{display:flex;justify-content:space-between;gap:4px}.receipt hr{border:0;border-top:1px dashed #555}
@media(max-width:900px){aside{width:190px}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){header{height:57px}.shell{display:block}aside{display:none}main{padding:15px 12px 88px}.pagehead h2{font-size:20px}.cards{gap:8px}.card{padding:12px}.stat .value{font-size:18px}.quick{grid-template-columns:repeat(2,1fr)}.bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding:5px 2px calc(5px + env(safe-area-inset-bottom))}.bottomnav button{background:transparent;color:#64748b;padding:4px 1px;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:2px}.bottomnav button.active{color:var(--blue)}.bottomnav b{font-size:17px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.pagehead{align-items:flex-start}.pagehead .right{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.pagehead .right button{padding:8px;font-size:11px}}

.menuToggle{display:none;background:#ffffff20;padding:8px 10px;white-space:nowrap}.menuOverlay{position:fixed;inset:0;background:#101c3280;z-index:30;display:flex;align-items:stretch}.menuPanel{width:min(340px,88vw);height:100%;overflow:auto;background:#fff;padding:16px;box-shadow:8px 0 30px #0002}.menuPanelHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.drawerNav{display:grid;gap:6px}.drawerNav button{width:100%;text-align:left;background:#f3f6fc;color:#24334c;padding:13px;border-radius:10px}.drawerNav button.active{background:#e3ebff;color:var(--blue);outline:1px solid #c5d5ff}
@media(max-width:900px){aside{display:none}.menuToggle{display:inline-flex}.headerRight{gap:5px}.headerRight #userLabel{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bottomnav{display:none!important}.shell{display:block}main{padding:16px 14px 30px}}
@media(max-width:420px){header{padding:0 8px;gap:6px}.brand{font-size:12px;gap:5px}.brandIcon{width:28px;height:28px}.menuToggle{font-size:11px;padding:7px}.headerRight button{font-size:11px;padding:7px}.headerRight #installBtn{display:none!important}}

@media print{body{background:#fff}.no-print{display:none!important}}
</style></head>
<body>
<div id="login">
 <section class="loginbox">
  <div class="row"><div class="logoMark">▦</div><div><h1>KASIR DIGITAL</h1><div class="tiny muted">SMART BUSINESS MANAGEMENT</div></div></div>
  <p class="sub">Satu aplikasi untuk mengelola berbagai jenis usaha.</p>
  <div class="rolebuttons"><button id="pickAdmin">Login Admin</button><button id="pickStaff" class="btn-orange">Login Karyawan</button></div>
  <form id="loginForm"><label id="roleLabel">Login sebagai Admin</label><input id="username" autocomplete="username" placeholder="Username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button style="width:100%;margin-top:14px">Masuk</button></form>
  <div class="hint">Akun awal: <b>admin</b> / <b>admin123</b>. Ganti password setelah masuk. Akun karyawan dibuat oleh admin.</div>
 </section>
</div>
<div id="app" class="hidden">
 <header><button id="menuToggle" class="menuToggle" aria-label="Buka semua menu" aria-expanded="false">☰ Menu</button><div class="brand"><span class="brandIcon">▦</span>KASIR DIGITAL</div><div class="headerRight"><span id="userLabel" class="tiny"></span><button id="installBtn" class="hidden">＋ Pasang</button><button id="logout">Keluar</button></div></header>
 <div class="shell"><aside><nav class="nav" id="sideNav"></nav></aside><main id="main"></main></div><nav class="bottomnav" id="bottomNav"></nav><div id="menuOverlay" class="menuOverlay hidden"><div class="menuPanel"><div class="menuPanelHead"><b>MENU KASIR DIGITAL</b><button id="menuClose" class="btn-outline">Tutup ✕</button></div><nav id="drawerNav" class="drawerNav"></nav></div></div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle"></h3><button class="btn-outline" id="modalClose">Tutup</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), money=n=>'Rp'+(Number(n)||0).toLocaleString('id-ID'), localDate=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const menu=[['home','Beranda','⌂'],['profile','Profil Toko','🏪'],['sale','Transaksi Baru','＋'],['transactions','Daftar Transaksi','▤'],['products','Produk','▣'],['expenses','Pengeluaran','↘'],['cash','Arus Kas','⇄'],['drawer','Modal Laci','▤'],['reports','Laporan','▥'],['settings','Pengaturan','⚙']];
function fresh(){return {version:2,shop:{name:'Toko Saya',owner:'',address:'',phone:'',email:'',description:'',logo:''},products:[],transactions:[],expenses:[],cash:[],drawer:[],staff:[],admin:{username:'admin',password:'admin123'},settings:{tax:0,payment:['Tunai','QRIS','Transfer','Kartu'],receiptTop:'Terima kasih telah berbelanja',receiptBottom:'Barang yang sudah dibeli tidak dapat dikembalikan.'},lastBackup:null}}
function readData(){try{let x=JSON.parse(localStorage.getItem('kasir_digital_data')||'null');return x&&x.admin&&Array.isArray(x.products)?{...fresh(),...x}:fresh()}catch{return fresh()}}
let db=readData(),current=null,loginAs='admin',page='home',cart=[],installEvent=null;
function persist(){try{localStorage.setItem('kasir_digital_data',JSON.stringify(db));return true}catch(e){notify('Penyimpanan penuh. Hapus foto berukuran besar atau buat backup.');return false}}
function notify(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.classList.add('hidden'),2600)}
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function admin(){return current?.role==='admin'}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};
function setLoginRole(r){loginAs=r;$('#roleLabel').textContent='Login sebagai '+(r==='admin'?'Admin':'Karyawan');$('#pickAdmin').className=r==='admin'?'':'btn-light';$('#pickStaff').className=r==='staff'?'btn-orange':'btn-light'}
$('#pickAdmin').onclick=()=>setLoginRole('admin');$('#pickStaff').onclick=()=>setLoginRole('staff');setLoginRole('admin');
$('#loginForm').onsubmit=e=>{e.preventDefault();let u=$('#username').value.trim(),p=$('#password').value;if(loginAs==='admin'){if(u===db.admin.username&&p===db.admin.password){current={name:'Admin',role:'admin'};start()}else notify('Username atau password admin salah')}else{let s=db.staff.find(x=>x.username===u&&x.password===p&&x.active);if(s){current={name:s.name,role:'staff',id:s.id};start()}else notify('Akun karyawan tidak aktif atau tidak ditemukan')}};
function start(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#userLabel').textContent=current.name+' · '+(admin()?'Admin':'Karyawan');render()}
$('#logout').onclick=()=>{current=null;cart=[];$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#password').value=''};
function allowed(p){if(admin())return true;return !['reports','settings','profile'].includes(p)}
function go(p){if(!allowed(p)){notify('Menu ini khusus admin');return}page=p;render()}
function nav(){let items=menu.filter(m=>allowed(m[0]));let markup=items.map(m=>`<button data-go="${m[0]}" class="${page===m[0]?'active':''}"><span class="ico">${m[2]}</span>${m[1]}</button>`).join('');$('#sideNav').innerHTML=markup;$('#drawerNav').innerHTML=markup;$('#bottomNav').innerHTML='';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{go(b.dataset.go);closeMenu()})}
function openMenu(){if(!admin()){}$('#menuOverlay').classList.remove('hidden');$('#menuToggle').setAttribute('aria-expanded','true')}
function closeMenu(){$('#menuOverlay').classList.add('hidden');$('#menuToggle').setAttribute('aria-expanded','false')}
$('#menuToggle').onclick=openMenu;$('#menuClose').onclick=closeMenu;$('#menuOverlay').addEventListener('click',e=>{if(e.target.id==='menuOverlay')closeMenu()});
function render(){nav();let titles={home:'Beranda',profile:'Profil Toko',sale:'Transaksi Baru',transactions:'Daftar Transaksi',products:'Produk',expenses:'Pengeluaran',cash:'Arus Kas',drawer:'Modal Laci',reports:'Laporan',settings:'Pengaturan'};$('#main').innerHTML=`<div class="pagehead"><div><h2>${titles[page]}</h2><p>${safe(db.shop.name)} · ${new Date().toLocaleDateString('id-ID',{dateStyle:'full'})}</p></div>${page==='sale'?'<div class="right"><button class="btn-orange" onclick="checkout()">Bayar</button></div>':''}</div>${({home:homePage,profile:profilePage,sale:salePage,transactions:transactionsPage,products:productsPage,expenses:expensesPage,cash:cashPage,drawer:drawerPage,reports:reportsPage,settings:settingsPage}[page]||homePage)()}`}
function stat(t,v,ic){return `<div class="card stat"><div><div class="tiny muted">${t}</div><div class="value">${v}</div></div><div class="statIcon">${ic}</div></div>`}
function homePage(){let today=localDate(),sales=db.transactions.filter(t=>t.date===today).reduce((a,t)=>a+t.total,0),count=db.transactions.filter(t=>t.date===today).length,expense=db.expenses.filter(x=>x.date===today).reduce((a,x)=>a+x.amount,0),bal=db.drawer.reduce((a,x)=>a+(x.type==='in'?x.amount:-x.amount),0);return `<div class="cards">${stat('Penjualan hari ini',money(sales),'💰')}${stat('Transaksi hari ini',count,'🧾')}${stat('Pengeluaran hari ini',money(expense),'↘')}${stat('Saldo modal laci',money(bal),'💵')}</div><div class="section"><h3>Akses cepat</h3><div class="quick"><button class="btn-orange" onclick="go('sale')"><b>＋</b>Transaksi Baru</button><button onclick="go('products')"><b>▣</b>Produk</button><button class="btn-yellow" onclick="go('drawer')"><b>💵</b>Modal Laci</button><button class="btn-light" onclick="go(admin()?'reports':'transactions')"><b>▥</b>${admin()?'Laporan':'Transaksi'}</button></div></div><div class="section"><h3>Transaksi terbaru</h3>${trxTable(db.transactions.slice().reverse().slice(0,5))}</div>`}
function salePage(){return `<div class="toolbar"><input id="saleSearch" placeholder="Cari produk..." oninput="drawPicker()"><select id="saleCategory" onchange="drawPicker()"><option value="">Semua kategori</option>${[...new Set(db.products.map(p=>p.category).filter(Boolean))].map(x=>`<option>${safe(x)}</option>`).join('')}</select></div><div id="picker" class="productgrid"></div><div class="card section"><h3>Keranjang belanja</h3><div id="cartBox">${cartHTML()}</div></div>`}
function drawPicker(){let q=($('#saleSearch')?.value||'').toLowerCase(),c=$('#saleCategory')?.value||'';let list=db.products.filter(p=>p.name.toLowerCase().includes(q)&&(!c||p.category===c));$('#picker').innerHTML=list.map(p=>`<div class="product">${p.photo?`<img src="${p.photo}">`:'<div style="height:105px;background:#eef3fb;display:grid;place-items:center;font-size:30px">📦</div>'}<div class="productbody"><h4>${safe(p.name)}</h4><div class="price">${money(p.price)}</div><div class="tiny muted">Stok: ${p.stock===null?'Tidak dibatasi':p.stock}</div><button onclick="addCart('${p.id}')" ${p.stock!==null&&p.stock<=0?'disabled':''}>Tambah</button></div></div>`).join('')||'<div class="empty">Produk belum tersedia.</div>'}
function addCart(id){let p=db.products.find(x=>x.id===id);if(!p)return;let item=cart.find(x=>x.id===id);if(item){if(p.stock!==null&&item.qty>=p.stock)return notify('Stok tidak mencukupi');item.qty++}else cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});$('#cartBox').innerHTML=cartHTML()}
function cartHTML(){if(!cart.length)return '<div class="empty">Keranjang kosong. Pilih produk untuk memulai.</div>';let sub=cart.reduce((a,x)=>a+x.price*x.qty,0);return `<div class="tablewrap"><table><thead><tr><th>Produk</th><th>Harga</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody>${cart.map(x=>`<tr><td>${safe(x.name)}</td><td>${money(x.price)}</td><td><input type="number" min="1" ${db.products.find(p=>p.id===x.id)?.stock!==null?'max="'+(db.products.find(p=>p.id===x.id)?.stock||0)+'"':''} value="${x.qty}" style="width:66px" onchange="qtyCart('${x.id}',this.value)"></td><td>${money(x.price*x.qty)}</td><td><button class="btn-danger" onclick="removeCart('${x.id}')">×</button></td></tr>`).join('')}</tbody></table></div><div class="between" style="padding:12px 0;font-weight:800">Subtotal <span>${money(sub)}</span></div><div class="formgrid"><div><label>Diskon (Rp)</label><input id="discount" type="number" min="0" value="0"></div><div><label>Pajak (%)</label><input id="tax" type="number" min="0" value="${db.settings.tax}"></div><div><label>Metode pembayaran</label><select id="method">${db.settings.payment.map(x=>`<option>${safe(x)}</option>`).join('')}</select></div><div><label>Uang diterima (Rp)</label><input id="paid" type="number" min="0" placeholder="Nominal pembayaran"></div></div>`}
function qtyCart(id,v){let it=cart.find(x=>x.id===id),p=db.products.find(x=>x.id===id);if(!it)return;let n=Math.max(1,Math.floor(Number(v)||1));if(p?.stock!==null&&p&&n>p.stock)n=p.stock;if(n<1){notify('Stok habis');n=1}it.qty=n;$('#cartBox').innerHTML=cartHTML()}
function removeCart(id){cart=cart.filter(x=>x.id!==id);$('#cartBox').innerHTML=cartHTML()}
function checkout(){if(!cart.length)return notify('Keranjang masih kosong');let sub=cart.reduce((a,x)=>a+x.price*x.qty,0),discount=Math.max(0,Number($('#discount')?.value||0)),taxRate=Math.max(0,Number($('#tax')?.value||0));if(discount>sub)return notify('Diskon tidak boleh melebihi subtotal');let tax=Math.round((sub-discount)*taxRate/100),total=sub-discount+tax,paid=Number($('#paid')?.value||0),method=$('#method')?.value||'Tunai';if(paid<total)return notify('Uang diterima belum mencukupi');for(let i of cart){let p=db.products.find(x=>x.id===i.id);if(!p||(p.stock!==null&&p.stock<i.qty))return notify('Stok '+i.name+' tidak mencukupi')}
 let t={id:'TRX-'+Date.now(),date:localDate(),time:new Date().toLocaleTimeString('id-ID'),items:cart.map(x=>({...x})),subtotal:sub,discount,tax,total,paid,change:paid-total,method,staff:current.name};db.transactions.push(t);cart.forEach(i=>{let p=db.products.find(x=>x.id===i.id);if(p.stock!==null)p.stock-=i.qty});db.cash.push({id:uid(),date:t.date,type:'in',amount:total,note:'Penjualan '+t.id,source:'sale'});if(method.toLowerCase()==='tunai')db.drawer.push({id:uid(),date:t.date,type:'in',amount:total,note:'Penjualan '+t.id,source:'sale'});persist();cart=[];render();receiptModal(t)}
function trxTable(list){if(!list.length)return '<div class="card empty">Belum ada transaksi.</div>';return `<div class="tablewrap"><table><thead><tr><th>Nomor</th><th>Tanggal</th><th>Total</th><th>Metode</th><th>Kasir</th><th>Aksi</th></tr></thead><tbody>${list.map(t=>`<tr><td>${safe(t.id)}</td><td>${safe(t.date)}</td><td><b>${money(t.total)}</b></td><td>${safe(t.method)}</td><td>${safe(t.staff)}</td><td><button class="btn-light" onclick="openReceipt('${t.id}')">Struk</button></td></tr>`).join('')}</tbody></table></div>`}

document.addEventListener('submit',e=>{if(e.target.id==='shopForm'){e.preventDefault();Object.assign(db.shop,Object.fromEntries(new FormData(e.target)));persist();notify('Profil toko disimpan');render()}if(e.target.id==='settingsForm'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));db.settings.tax=Math.max(0,Number(d.tax)||0);db.settings.payment=d.payment.split(',').map(x=>x.trim()).filter(Boolean);if(!db.settings.payment.length)db.settings.payment=['Tunai'];db.settings.receiptTop=d.receiptTop;db.settings.receiptBottom=d.receiptBottom;persist();notify('Pengaturan disimpan');render()}});
document.addEventListener('change',e=>{if(e.target.id==='shopLogo'){let f=e.target.files[0];if(!f)return;if(f.size>1200000)return notify('Logo maksimal 1,2 MB');let r=new FileReader();r.onload=()=>{db.shop.logo=r.result;persist();render()};r.readAsDataURL(f)}if(e.target.id==='restoreInput'){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.admin||!Array.isArray(x.products)||!Array.isArray(x.transactions))throw Error();if(!confirm('Pulihkan backup? Data perangkat ini akan diganti.'))return;db={...fresh(),...x};persist();cart=[];render();notify('Backup berhasil dipulihkan')}catch{notify('File backup tidak valid')}};r.readAsText(f)}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;$('#installBtn').classList.remove('hidden')});$('#installBtn').onclick=async()=>{if(!installEvent)return;installEvent.prompt();await installEvent.userChoice;installEvent=null;$('#installBtn').classList.add('hidden')};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
